<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متابعة أوراق الصيدلية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f5;--card:#fff;--ink:#12343b;--mute:#5d7378;--line:#d8e3e1;--pri:#0f766e;--bad:#b42318;--badbg:#fdecea;--warn:#9a6700;--warnbg:#fff4d6;--ok:#1b7f4d;--okbg:#e4f5ec}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1c;--card:#16272a;--ink:#e6f0ee;--mute:#92a8ab;--line:#26403f;--pri:#2dd4bf;--bad:#ff8a7d;--badbg:#3a1d1b;--warn:#f5c451;--warnbg:#3a2f12;--ok:#5fd394;--okbg:#14301f}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.6}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){header{color:#04201d}}
h1{margin:0;font-size:22px;font-weight:800}
#pinfo{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;margin-bottom:8px;font-size:15px}
#pinfo strong{font-size:20px;font-weight:800}
#pinfo .lg{height:64px;max-width:140px;object-fit:contain}
#pinfo small{opacity:.8;margin-inline-end:4px}
#pinfo .btn{padding:3px 12px;font-size:13px}
header{position:relative;padding-bottom:28px}
.by{position:absolute;left:10px;bottom:5px;font-size:10px;opacity:.85}
#welcome{text-align:center;padding:90px 20px}
#welcome p{color:var(--mute);margin:0 0 20px;font-size:18px}
#welcome .btn{font-size:20px;padding:14px 34px}
.hbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
main{max-width:1100px;margin:0 auto;padding:20px}
button,input,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:8px;cursor:pointer}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
@media(prefers-color-scheme:dark){.btn.p{color:#04201d}}
.btn.d{color:var(--bad)}
header .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.5)}
header select{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px}
header select option{color:#000}
input,select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;width:100%}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#alerts{margin-bottom:18px}
.al{border-radius:12px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.al h2{margin:0;padding:12px 16px;font-size:16px;display:flex;gap:14px;flex-wrap:wrap}
.al ul{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto}
.al li{padding:9px 16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;cursor:pointer;font-size:14px}
.al li:hover{background:var(--bg)}
.tag{padding:1px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}.ok{background:var(--okbg);color:var(--ok)}.none{background:var(--bg);color:var(--mute)}
.allok{padding:14px 16px;color:var(--ok);font-weight:700}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:99px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav b{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-inline-start:6px}
.tb{display:flex;gap:10px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--line);border-radius:12px;padding:14px}
.card.bad{border-inline-start-color:var(--bad)}.card.warn{border-inline-start-color:var(--warn)}.card.ok{border-inline-start-color:var(--ok)}
.card .top{display:flex;gap:12px;align-items:center}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--line);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--mute);flex:none}
.card h3{margin:0;font-size:18px}.card .m{color:var(--mute);font-size:14px}
.card a{color:inherit}
.docs{margin:12px 0 0;display:grid;gap:6px}
.doc{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;padding:6px 8px;border-radius:8px}
.doc button{border:0;background:none;cursor:pointer;text-decoration:underline;color:inherit;padding:0}
.acts{display:flex;gap:8px;margin-top:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);max-height:92vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{padding:14px 20px;border-bottom:1px solid var(--line);font-weight:800;font-size:18px}
.db{padding:16px 20px;display:grid;gap:12px;overflow:auto;max-height:calc(92vh - 130px)}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{display:flex;gap:12px;align-items:center}
.ph img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--line)}
.dr{border:1px dashed var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.dr .r3{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.dr .fl{display:flex;gap:10px;align-items:center}
.dr img{width:56px;height:56px;object-fit:cover;border-radius:6px;cursor:zoom-in}
#vw img{max-width:100%;display:block;margin:auto}
@media(max-width:520px){.r2,.dr .r3{grid-template-columns:1fr}}
.adm .acts,.adm #add{display:none}
#lgn{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center}
.lbox{background:var(--card);padding:24px;border-radius:14px;display:grid;gap:12px;width:min(340px,90vw);box-shadow:0 4px 20px #0003}
#lerr{color:var(--bad);min-height:20px;font-size:14px}
#bf{max-width:190px}
</style>

<body>
<header>
  <span class="by">محمد ابوالعطا</span>
  <div><div id="pinfo"></div><h1>متابعة أوراق الصيدلية</h1></div>
  <div class="hbar">
    <span>التنبيه قبل الانتهاء بـ</span>
    <select id="days"><option value="7">7 أيام</option><option value="15">15 يوم</option><option value="30">30 يوم</option><option value="60">60 يوم</option><option value="90">90 يوم</option></select>
    <span id="who"></span>
    <button class="btn" id="lo">خروج</button>
  </div>
</header>
<div id="lgn"><div class="lbox"><h2 style="margin:0">تسجيل الدخول</h2><input id="le" placeholder="رقم حساب الصيدلية" autocomplete="username"><input id="lp" type="password" placeholder="كلمة المرور" autocomplete="current-password"><input id="lp2" type="password" placeholder="أعد كتابة كلمة السر" autocomplete="new-password" hidden><div id="lerr"></div><button class="btn p" id="li">دخول</button><button class="btn" id="lreg" type="button">أول مرة؟ سجّل صيدليتك</button></div></div>
<main>
  <div id="welcome"><p>ابدأ بتسجيل بيانات الصيدلية</p><button class="btn p" id="addph">إضافة صيدلية</button></div>
  <div id="app">
  <div id="alerts"></div>
  <nav id="tabs"></nav>
  <div class="tb"><input id="q" type="search" placeholder="بحث بالاسم أو الموبايل"><select id="bf" hidden></select><button class="btn p" id="add"></button></div>
  <div class="grid" id="list"></div>
  </div>
</main>

<dialog id="frm">
  <div class="dh" id="ft"></div>
  <div class="db">
    <div class="ph"><img id="pv" alt=""><label>الصورة<input type="file" id="pf" accept="image/*"></label></div>
    <div class="r2"><label>الاسم<input id="nm"></label><label id="empl">الرقم الوظيفي<input id="emp"></label><label id="mbl">رقم الموبايل<input id="mb" type="tel" inputmode="tel"></label></div>
    <label id="exl">بيانات إضافية<input id="ex"></label>
    <div class="r2" id="pxr"><label>رقم الحساب<input id="pa"></label><label>رقم الصحة<input id="phn"></label></div>
    <div><b>التراخيص والأوراق</b></div>
    <div id="drs" style="display:grid;gap:10px"></div>
    <button class="btn" id="adr" type="button">+ إضافة ورقة</button>
  </div>
  <div class="df"><button class="btn" id="cn">إلغاء</button><button class="btn p" id="sv">حفظ</button></div>
</dialog>
<dialog id="vw"><div class="db"><img id="vi" alt=""></div><div class="df"><button class="btn p" id="vp">طباعة</button><button class="btn" id="vc">إغلاق</button></div></dialog>
<datalist id="dl"></datalist>

const CATS={
 pharmacy:{n:'الصيدلية',one:'صيدلية',ex:'العنوان',docs:['ترخيص الصيدلية','السجل التجاري','شهادة الدفاع المدني','البطاقة الضريبية']},
 pharmacist:{n:'الصيادلة',one:'صيدلي',ex:'رقم الإقامة / الهوية',docs:['الإقامة','خطاب أجير','ترخيص مزاولة المهنة','الشهادة الصحية']},
 assistant:{n:'المساعدون',one:'مساعد',ex:'رقم الإقامة / الهوية',docs:['الإقامة','خطاب أجير','الشهادة الصحية']},
 worker:{n:'العمال',one:'عامل',ex:'رقم الإقامة / الهوية',docs:['الإقامة','خطاب أجير','الشهادة الصحية']},
 delivery:{n:'كباتن التوصيل',one:'كابتن توصيل',ex:'رقم الإقامة / الهوية',docs:['الإقامة','خطاب أجير','رخصة القيادة','استمارة المركبة']}
};
const $=id=>document.getElementById(id);
let S={days:+localStorage.getItem('pdDays')||30,items:[]},cat='pharmacy',edit=null,photo='';
let ME=null,PROF={},BF='';
const adm=()=>ME&&ME.role==='admin',vis=()=>S.items.filter(i=>!BF||i.owner===BF);
function save(){try{localStorage.setItem('pdDays',S.days)}catch(e){}return true}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function left(exp){return Math.ceil((new Date(exp+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5)}
function st(d){
 if(!d.exp)return{k:'none',t:'بدون تاريخ',r:0};
 const n=left(d.exp);
 if(n<0)return{k:'bad',t:'منتهية منذ '+(-n)+' يوم',r:3};
 if(n===0)return{k:'bad',t:'تنتهي اليوم',r:3};
 if(n<=S.days)return{k:'warn',t:'تنتهي خلال '+n+' يوم',r:2};
 return{k:'ok',t:'سارية حتى '+d.exp,r:1};
}
function daysTxt(d){
 if(!d.exp)return'بدون تاريخ';
 const n=left(d.exp);
 return n<0?'منتهية منذ '+(-n)+' يوم':n===0?'تنتهي اليوم':'متبقي '+n+' يوم';
}
function worst(it){return Math.max(0,...it.docs.map(d=>st(d).r))}
function img(file,max,cb,type){
 const fr=new FileReader();
 fr.onload=()=>{const i=new Image();i.onload=()=>{
  const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');
  c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
  cb(type?c.toDataURL(type):c.toDataURL('image/jpeg',.6))};i.src=fr.result};
 fr.readAsDataURL(file);
}
function renderAlerts(){
 const bad=[],warn=[];
 vis().forEach(it=>it.docs.forEach(d=>{const s=st(d);if(s.r===3)bad.push([it,d,s]);else if(s.r===2)warn.push([it,d,s])}));
 const rows=[...bad,...warn].map(([it,d,s])=>`<li data-id="${it.id}"><span>${esc(it.name)} <small>(${CATS[it.cat].one}${adm()?' · '+esc(PROF[it.owner]||''):''})</small> — ${esc(d.type)}</span><span class="tag ${s.k}">${s.t}</span></li>`).join('');
 $('alerts').innerHTML=`<div class="al"><h2><span>تنبيهات الأوراق</span><span class="tag bad">منتهية: ${bad.length}</span><span class="tag warn">قاربت على الانتهاء: ${warn.length}</span></h2>`+
  (rows?`<ul>${rows}</ul>`:`<div class="allok">كل الأوراق سارية ولا يوجد ما يحتاج تجديداً.</div>`)+`</div>`;
 $('alerts').querySelectorAll('li').forEach(li=>li.onclick=()=>{const it=S.items.find(x=>x.id===li.dataset.id);cat=it.cat;render();openForm(it)});
}
function renderTabs(){
 $('tabs').innerHTML=Object.keys(CATS).map(k=>{
  const c=vis().filter(i=>i.cat===k&&worst(i)>=2).length;
  return`<button data-k="${k}" class="${k===cat?'on':''}">${CATS[k].n} (${vis().filter(i=>i.cat===k).length})${c?`<b>${c}</b>`:''}</button>`}).join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.k;render()});
}
function render(){
 $('days').value=S.days;
 const ph=adm()?{}:S.items.find(i=>i.cat==='pharmacy');
 $('welcome').hidden=!!ph;$('app').hidden=!ph;
 $('pinfo').innerHTML=ph?`<img class="lg" src="${DEFAULT_LOGO}" alt="" onerror="this.remove()"><strong>${esc(ph.name)}</strong><span><small>رقم الحساب:</small>${esc(ph.acc||'—')}</span><span><small>رقم الصحة:</small>${esc(ph.health||'—')}</span><button class="btn" id="eph">تعديل</button>`:'';
 if(adm())$('pinfo').innerHTML='<strong>لوحة الإدارة — كل الفروع</strong>';else if(ph)$('eph').onclick=()=>openForm(ph);
 if(!ph)return;
 renderAlerts();renderTabs();
 $('add').textContent='+ إضافة '+CATS[cat].one;
 $('add').hidden=cat==='pharmacy';
 const q=$('q').value.trim().toLowerCase();
 const list=vis().filter(i=>i.cat===cat&&(!q||(i.name+i.phone+(i.emp||'')).toLowerCase().includes(q))).sort((a,b)=>worst(b)-worst(a));
 $('list').innerHTML=list.length?list.map(it=>{
  const w=worst(it),k=['none','ok','warn','bad'][w];
  return`<div class="card ${k}" data-id="${it.id}"><div class="top">${it.photo?`<img class="av" src="${it.photo}" alt="">`:`<div class="av">${esc(it.name.charAt(0))}</div>`}
  <div><h3>${esc(it.name)}</h3>${adm()?`<div class="m">الفرع: ${esc(PROF[it.owner]||'')}</div>`:''}${it.emp?`<div class="m">الرقم الوظيفي: ${esc(it.emp)}</div>`:''}<div class="m">${it.phone?`<a href="tel:${esc(it.phone)}">${esc(it.phone)}</a>`:'—'}</div>${it.extra?`<div class="m">${esc(it.extra)}</div>`:''}</div></div>
  <div class="docs">${it.docs.length?it.docs.map((d,i)=>{const s=st(d);return`<div class="doc ${s.k}"><span>${esc(d.type)}${d.exp?' · '+d.exp:''} — ${daysTxt(d)}</span>${d.img||d.has?`<button data-v="${i}">عرض</button>`:''}</div>`}).join(''):'<div class="m">لا توجد أوراق مسجلة</div>'}</div>
  <div class="acts"><button class="btn" data-e>تعديل</button><button class="btn d" data-x>حذف</button></div></div>`}).join(''):`<div class="empty">لا يوجد ${CATS[cat].n} بعد. اضغط زر الإضافة للبدء.</div>`;
 $('list').querySelectorAll('.card').forEach(c=>{
  const it=S.items.find(x=>x.id===c.dataset.id);
  c.querySelector('[data-e]').onclick=()=>openForm(it);
  c.querySelector('[data-x]').onclick=async()=>{if(confirm('حذف '+it.name+' وكل أوراقه؟')){const{error}=await sb.from('items').delete().eq('id',it.id);if(error){alert('تعذر الحذف: '+error.message);return}S.items=S.items.filter(x=>x!==it);render()}};
  c.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>openDoc(it.docs[b.dataset.v]));
 });
}
function printImg(src){
 const f=document.createElement('iframe');
 f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
 f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){alert('تعذر فتح الطباعة')}setTimeout(()=>f.remove(),60000)};
 f.srcdoc='<html><head><style>@page{margin:10mm}body{margin:0}img{display:block;margin:auto;max-width:100%;max-height:275mm}</style></head><body><img src="'+src+'"></body></html>';
 ($('vw').open?$('vw'):document.body).appendChild(f);
}
async function openDoc(d){
 if(!d.img){const{data,error}=await sb.from('imgs').select('data').eq('id',d.iid).single();if(error||!data){alert('تعذر تحميل الصورة');return}d.img=data.data}
 showImg(d.img);
}
function showImg(s){$('vi').src=s;$('vw').showModal()}
function docRow(d){
 d=d||{type:'',exp:''};
 const r=document.createElement('div');r.className='dr';r._img=d.img;r._iid=d.iid||crypto.randomUUID();r._has=d.has;
 r.innerHTML=`<div class="r3"><label>نوع الورقة<input list="dl" class="t" value="${esc(d.type).replace(/"/g,'&quot;')}"></label><label>تاريخ الانتهاء<input type="date" class="e" value="${d.exp||''}"></label></div>
 <div class="fl"><label style="flex:1">صورة الورقة<input type="file" class="f" accept="image/*"></label>${d.img?`<img src="${d.img}" alt="">`:d.has?'<button class="btn" type="button" data-sv>عرض الصورة المحفوظة</button>':''}<button class="btn d" type="button">حذف</button></div>`;
 r.querySelector('.f').onchange=e=>{if(e.target.files[0])img(e.target.files[0],800,u=>{r._img=u;let p=r.querySelector('.fl img');if(!p){p=new Image();p.onclick=()=>showImg(r._img);r.querySelector('.fl').insertBefore(p,r.querySelector('button.d'))}p.src=u})};
 r.querySelector('img')&&(r.querySelector('img').onclick=()=>showImg(r._img));
 r.querySelector('button.d').onclick=()=>r.remove();
 const sv=r.querySelector('[data-sv]');if(sv)sv.onclick=()=>openDoc(d);
 $('drs').appendChild(r);
}
function openForm(it){
 edit=it||null;photo=it?it.photo:'';
 const c=CATS[it?it.cat:cat];
 $('ft').textContent=(it?'تعديل ':'إضافة ')+c.one;
 $('nm').value=it?it.name:'';$('mb').value=it?it.phone:'';$('ex').value=it?it.extra:'';
 $('exl').firstChild.textContent=c.ex;
 const isP=(it?it.cat:cat)==='pharmacy';
 $('pxr').hidden=!isP;
 $('empl').hidden=isP;$('emp').value=it&&it.emp||'';
 $('mbl').firstChild.textContent=isP?'رقم التليفون':'رقم الموبايل';
 $('pa').value=it&&it.acc||(!it&&ME&&ME.acc)||'';$('phn').value=it&&it.health||'';
 $('pv').src=photo||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72"><rect width="72" height="72" fill="#ccc"/></svg>');
 $('pf').value='';$('drs').innerHTML='';
 $('dl').innerHTML=c.docs.map(x=>`<option value="${x}">`).join('');
 (it?it.docs:c.docs.map(t=>({type:t,exp:'',img:''}))).forEach(docRow);
 $('frm').showModal();
}
$('pf').onchange=e=>{if(e.target.files[0])img(e.target.files[0],240,u=>{photo=u;$('pv').src=u})};
$('adr').onclick=()=>docRow();
$('cn').onclick=()=>$('frm').close();
$('vc').onclick=()=>$('vw').close();
$('vp').onclick=()=>printImg($('vi').src);
$('add').onclick=()=>openForm();
$('addph').onclick=()=>{cat='pharmacy';openForm()};
$('sv').onclick=async()=>{
 const name=$('nm').value.trim();
 if(!name){alert('اكتب الاسم أولاً');$('nm').focus();return}
 const docs=[...$('drs').children].map(r=>({type:r.querySelector('.t').value.trim(),exp:r.querySelector('.e').value,iid:r._iid,has:!!(r._img||r._has),img:r._img||''})).filter(d=>d.type);
 const c=edit?edit.cat:cat,id=edit?edit.id:crypto.randomUUID();
 const data={cat:c,name,phone:$('mb').value.trim(),extra:$('ex').value.trim(),photo,docs:docs.map(({img,...d})=>d)};
 if(c==='pharmacy'){data.acc=$('pa').value.trim();data.health=$('phn').value.trim()}else data.emp=$('emp').value.trim();
 $('sv').disabled=true;
 try{
  const r1=await sb.from('items').upsert({id,data});if(r1.error)throw r1.error;
  const im=docs.filter(d=>d.img).map(d=>({id:d.iid,item_id:id,data:d.img}));
  if(im.length){const r2=await sb.from('imgs').upsert(im);if(r2.error)throw r2.error}
  if(edit){const keep=new Set(docs.map(d=>d.iid)),gone=edit.docs.filter(d=>d.iid&&!keep.has(d.iid)).map(d=>d.iid);if(gone.length)await sb.from('imgs').delete().in('id',gone)}
  const mem={...data,id,owner:edit?edit.owner:ME.id,docs};
  S.items=edit?S.items.map(x=>x===edit?mem:x):[...S.items,mem];
  $('frm').close();render();
 }catch(e){alert('تعذر الحفظ: '+(e.message||e))}
 $('sv').disabled=false;
};
$('days').onchange=()=>{S.days=+$('days').value;save();render()};
$('q').oninput=render;
$('bf').onchange=()=>{BF=$('bf').value;render()};
function showLogin(m){$('lgn').hidden=false;$('lerr').textContent=m||''}
async function start(u){
 const{data:p,error}=await sb.from('profiles').select('id,branch,role');
 if(error||!p||!p.length){await sb.auth.signOut();showLogin('الحساب غير مفعّل، تواصل مع الإدارة');return}
 PROF=Object.fromEntries(p.map(x=>[x.id,x.branch]));ME=p.find(x=>x.id===u.id);ME.acc=(u.email||'').split('@')[0];
 const{data:rows,error:e2}=await sb.from('items').select('id,owner,data');
 if(e2){alert('تعذر تحميل البيانات: '+e2.message);return}
 S.items=rows.map(r=>({...r.data,id:r.id,owner:r.owner}));
 const BR=p.filter(x=>x.role!=='admin').sort((a,b)=>a.branch.localeCompare(b.branch,'ar'));
 $('bf').innerHTML='<option value="">كل الفروع ('+BR.length+')</option>'+BR.map(x=>`<option value="${x.id}">${esc(x.branch)}</option>`).join('');
 $('bf').hidden=!adm();document.body.classList.toggle('adm',!!adm());
 $('who').textContent=adm()?'الإدارة':ME.branch;$('lgn').hidden=true;render();
}
let REG=false;
const mail=v=>(v=v.trim().toLowerCase(),v.includes('@')?v:v.replace(/\s/g,'')+'@pharmacy-docs.app');
$('lreg').onclick=()=>{REG=!REG;$('lp2').hidden=!REG;$('li').textContent=REG?'إنشاء الحساب':'دخول';$('lreg').textContent=REG?'لدي حساب بالفعل':'أول مرة؟ سجّل صيدليتك';$('lerr').textContent=''};
$('li').onclick=async()=>{
 if(!sb){showLogin('لم يتم ضبط إعدادات قاعدة البيانات في الملف');return}
 const em=mail($('le').value),pw=$('lp').value;
 if(!$('le').value.trim()||!pw){showLogin('اكتب رقم الحساب وكلمة السر');return}
 if(REG){
  if(pw.length<8){showLogin('كلمة السر 8 أحرف على الأقل');return}
  if(pw!==$('lp2').value){showLogin('كلمتا السر غير متطابقتين');return}
  const{data,error}=await sb.auth.signUp({email:em,password:pw});
  if(error){showLogin(/Database error/i.test(error.message)?'رقم الحساب غير مسجل لدى الإدارة':/registered/i.test(error.message)?'هذا الحساب مسجل من قبل، اضغط «لدي حساب بالفعل»':error.message);return}
  if(!data.session){showLogin('تعذر الدخول بعد التسجيل، راجع الإدارة');return}
  start(data.user);return;
 }
 const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
 if(error){showLogin('رقم الحساب أو كلمة السر غير صحيحة');return}
 start(data.user);
};
$('lp').addEventListener('keydown',e=>{if(e.key==='Enter')$('li').click()});
$('lo').onclick=async()=>{if(sb)await sb.auth.signOut();location.reload()};
(async()=>{
 if(!sb){showLogin('لم يتم ضبط إعدادات قاعدة البيانات في الملف');return}
 const{data:{session}}=await sb.auth.getSession();
 if(session)start(session.user);else showLogin();
})();
</script>
</body>
</html>
